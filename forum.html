<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Host file forum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --android-green: #3ddc84; --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 750px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1, h2, h3 { color: #fff; }
    .card { background: var(--card-bg); border: 1px solid #333; padding: 1.2rem; margin-bottom: 1.2rem; border-radius: 8px; }
    .hidden { display: none; }
    .meta { font-size: 0.85rem; color: #aaa; margin-bottom: 0.5rem; }
    .tag { background: #2d3748; color: var(--android-green); padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
    input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
    textarea { font-family: monospace; font-size: 0.9rem; white-space: pre; }
    button { background: var(--android-green); color: #000; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
    button:hover { opacity: 0.9; }
    button.alt { background: #444; color: #fff; margin-left: 8px; }
    pre { background: #000; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 0.85rem; color: #3ddc84; border: 1px solid #222; }
  </style>
</head>
<body>

  <h1> Android Host file forum </h1>

  <!-- Auth View -->
  <div id="authSection" class="card">
    <h3 id="authTitle">Sign In / Sign Up</h3>
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="handleAuth('login')">Log In</button>
    <button class="alt" onclick="handleAuth('signup')">Sign Up</button>
  </div>

  <!-- Main Forum View -->
  <div id="forumSection" class="hidden">
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <span>Logged in as: <strong id="userEmail" style="color: var(--android-green);"></strong></span>
      <button class="alt" onclick="logout()">Log Out</button>
    </div>

    <!-- Submit Hosts Snippet -->
    <div class="card">
      <h3>Share Hosts Rules</h3>
      <input type="text" id="postTitle" placeholder="Title (e.g., Anti-Adware Ruleset 2026)" />
      
      <select id="postCategory">
        <option value="Adblocking">Adblocking</option>
        <option value="Malware & Tracking">Malware & Tracking</option>
        <option value="Social Media Block">Social Media Block</option>
        <option value="Gaming & Apps">Gaming & Apps</option>
        <option value="Custom">Custom / General</option>
      </select>

      <textarea id="postContent" rows="6" placeholder="0.0.0.0 ads.example.com&#10;0.0.0.0 tracking.badsite.com"></textarea>
      <button onclick="createPost()">Publish Rules</button>
    </div>

    <h3>Community Rulesets</h3>
    <div id="postsFeed"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hzazezszxbgethzkqmmf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YXplenN6eGJlZ3RoemtxbW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjA3NjQsImV4cCI6MjEwMzgzNjc2NH0.Vgi0AbiYnzPOD_uVafIMcUbNS-DbnD16BlVYTuHopQA';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = null;

    supabaseClient.auth.onAuthStateChange((event, session) => {
      currentUser = session ? session.user : null;
      if (currentUser) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('forumSection').classList.remove('hidden');
        document.getElementById('userEmail').innerText = currentUser.email;
        loadPosts();
      } else {
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('forumSection').classList.add('hidden');
      }
    });

    async function handleAuth(type) {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { error } = type === 'signup' 
        ? await supabaseClient.auth.signUp({ email, password })
        : await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) alert(error.message);
      else if (type === 'signup') alert('Account created! Please log in.');
    }

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    async function loadPosts() {
      const { data, error } = await supabaseClient
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) return console.error(error);
      
      const feed = document.getElementById('postsFeed');
      feed.innerHTML = data.map(post => `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0;">${escapeHtml(post.title || 'Untitled Hosts File')}</h3>
            <span class="tag">${escapeHtml(post.category || 'General')}</span>
          </div>
          <div class="meta">Shared by ${post.user_email} on ${new Date(post.created_at).toLocaleDateString()}</div>
          <pre id="code-${post.id}"><code>${escapeHtml(post.content)}</code></pre>
          <button class="alt" onclick="copyRules('code-${post.id}')">Copy Rules</button>
        </div>
      `).join('');
    }

    async function createPost() {
      const title = document.getElementById('postTitle').value;
      const category = document.getElementById('postCategory').value;
      const content = document.getElementById('postContent').value;
      
      if (!title || !content) return alert('Please enter both a title and host rules.');

      const { error } = await supabaseClient
        .from('posts')
        .insert([{ 
          title: title, 
          category: category, 
          content: content, 
          user_email: currentUser.email 
        }]);

      if (error) alert(error.message);
      else {
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        loadPosts();
      }
    }

    function copyRules(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text);
      alert('Hosts rules copied to clipboard!');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
