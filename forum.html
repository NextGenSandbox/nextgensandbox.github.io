<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android Hosts File Forum</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --card-hover: #20242c;
      --text: #e2e8f0;
      --muted: #a0aec0;
      --accent: #3ddc84;
      --accent-dark: #2bbd6d;
      --error: #ef4444;
      --border: #2d3748;
      --input: #2d3748;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
      line-height: 1.5;
    }

    h1,
    h2,
    h3 {
      color: #fff;
    }

    h1 {
      margin-top: 10px;
    }

    .box {
      background: var(--card);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .hidden {
      display: none !important;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      background: var(--input);
      border: 1px solid #4a5568;
      color: white;
      border-radius: 6px;
      font: inherit;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
      border-color: transparent;
    }

    button {
      background: var(--accent);
      color: #07120c;
      padding: 11px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      font-size: 15px;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .btn-secondary {
      background: #4a5568;
      color: white;
    }

    .error-msg {
      color: var(--error);
      font-weight: 600;
      margin-bottom: 15px;
    }

    .success-msg {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 15px;
    }

    .info-msg {
      color: #93c5fd;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .post-header {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .post-header h3 {
      overflow-wrap: anywhere;
    }

    .tag {
      background: #2d3748;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      color: var(--accent);
      white-space: nowrap;
    }

    .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    pre {
      background: #080a0d;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--accent);
      border: 1px solid var(--border);
      max-height: 500px;
      overflow-y: auto;
    }

    .account-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .auth-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .auth-buttons button {
      margin: 0;
    }

    .loading {
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: -7px;
      margin-bottom: 15px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .box {
        padding: 16px;
      }

      .account-bar,
      .post-header {
        flex-direction: column;
        align-items: stretch;
      }

      .tag {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>
  <h1>🤖 Android Hosts File Forum</h1>

  <!-- AUTHENTICATION -->
  <section id="authPage" class="box">
    <h2>Account Login / Register</h2>

    <div id="authMessage"></div>

    <label for="username">Username</label>
    <input
      type="text"
      id="username"
      maxlength="24"
      autocomplete="username"
      placeholder="Choose a username"
    />

    <div class="hint">
      3–24 characters. Letters, numbers, underscores and hyphens only.
    </div>

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      minlength="6"
      maxlength="128"
      autocomplete="current-password"
      placeholder="At least 6 characters"
    />

    <div class="auth-buttons">
      <button id="loginButton" type="button" onclick="handleAuth('login')">
        Sign In
      </button>

      <button
        id="registerButton"
        type="button"
        class="btn-secondary"
        onclick="handleAuth('register')"
      >
        Create Account
      </button>
    </div>
  </section>

  <!-- FORUM -->
  <main id="forumPage" class="hidden">

    <section class="box account-bar">
      <div>
        Logged in as:
        <strong id="userDisplay" style="color: var(--accent);"></strong>
      </div>

      <button
        class="btn-secondary"
        type="button"
        onclick="logout()"
      >
        Log Out
      </button>
    </section>

    <section class="box">
      <h2>Share a New Hosts File</h2>

      <div id="postMessage"></div>

      <label for="postTitle">Title</label>
      <input
        type="text"
        id="postTitle"
        maxlength="100"
        placeholder="Example: Block Common Ad Servers"
      />

      <label for="postCategory">Category</label>
      <select id="postCategory">
        <option value="Adblocking">Adblocking</option>
        <option value="Malware">Malware & Tracking</option>
        <option value="Gaming">Gaming & Apps</option>
        <option value="General">General</option>
      </select>

      <label for="postContent">Hosts rules</label>
      <textarea
        id="postContent"
        maxlength="50000"
        spellcheck="false"
        placeholder="0.0.0.0 ads.example.com&#10;0.0.0.0 tracker.example.com"
      ></textarea>

      <button id="publishButton" type="button" onclick="createPost()">
        Publish Post
      </button>
    </section>

    <h2>Recent Posts</h2>

    <div id="postsStatus" class="loading"></div>
    <div id="postsFeed"></div>
  </main>

  <script>
    /*
     * ============================================================
     * SUPABASE CONFIGURATION
     * ============================================================
     *
     * The anon/publishable key is intended to be used in browser
     * applications.
     *
     * NEVER put a Supabase service_role key in this file.
     */

    const SUPABASE_URL =
      "https://hzazezszxbgethzkqmmf.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YXplenN6eGJlZ3RoemtxbW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjA3NjQsImV4cCI6MjEwMzgzNjc2NH0.Vgi0AbiYnzPOD_uVafIMcUbNS-DbnD16BlVYTuHopQA";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    let currentUser = null;
    let currentUsername = null;

    const ALLOWED_CATEGORIES = [
      "Adblocking",
      "Malware",
      "Gaming",
      "General"
    ];

    /*
     * Because Supabase Auth normally authenticates by email,
     * this application converts a forum username into an
     * internal email address.
     *
     * Users never need to see or enter this email.
     *
     * IMPORTANT:
     * Disable "Confirm email" in your Supabase project when
     * using this username-only system.
     */
    function usernameToEmail(username) {
      return `${username}@users.androidhostforum.com`;
    }

    function normalizeUsername(value) {
      return String(value || "")
        .trim()
        .toLowerCase();
    }

    function isValidUsername(username) {
      return /^[a-z0-9_-]{3,24}$/.test(username);
    }

    function setMessage(elementId, message, type = "error") {
      const element = document.getElementById(elementId);

      element.textContent = message || "";

      if (!message) {
        element.className = "";
        return;
      }

      if (type === "success") {
        element.className = "success-msg";
      } else if (type === "info") {
        element.className = "info-msg";
      } else {
        element.className = "error-msg";
      }
    }

    function setAuthLoading(loading) {
      document.getElementById("loginButton").disabled = loading;
      document.getElementById("registerButton").disabled = loading;
    }

    /*
     * ============================================================
     * AUTH STATE
     * ============================================================
     */

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {
        if (session?.user) {
          currentUser = session.user;

          currentUsername =
            session.user.user_metadata?.username ||
            "user";

          showForum();
          await loadPosts();
        } else {
          currentUser = null;
          currentUsername = null;
          showAuthPage();
        }
      }
    );

    async function initializeApp() {
      const {
        data: { session },
        error
      } = await supabaseClient.auth.getSession();

      if (error) {
        console.error("Session error:", error);
      }

      if (session?.user) {
        currentUser = session.user;

        currentUsername =
          session.user.user_metadata?.username ||
          "user";

        showForum();
        await loadPosts();
      } else {
        showAuthPage();
      }
    }

    function showForum() {
      document
        .getElementById("authPage")
        .classList.add("hidden");

      document
        .getElementById("forumPage")
        .classList.remove("hidden");

      document.getElementById("userDisplay").textContent =
        currentUsername || "User";
    }

    function showAuthPage() {
      document
        .getElementById("forumPage")
        .classList.add("hidden");

      document
        .getElementById("authPage")
        .classList.remove("hidden");
    }

    /*
     * ============================================================
     * REGISTER / LOGIN
     * ============================================================
     */

    async function handleAuth(action) {
      const usernameInput =
        document.getElementById("username");

      const passwordInput =
        document.getElementById("password");

      const username =
        normalizeUsername(usernameInput.value);

      const password =
        passwordInput.value;

      setMessage("authMessage", "");

      if (!username || !password) {
        setMessage(
          "authMessage",
          "Enter both a username and password."
        );
        return;
      }

      if (!isValidUsername(username)) {
        setMessage(
          "authMessage",
          "Username must be 3–24 characters and contain only letters, numbers, underscores or hyphens."
        );
        return;
      }

      if (password.length < 6) {
        setMessage(
          "authMessage",
          "Password must contain at least 6 characters."
        );
        return;
      }

      const email = usernameToEmail(username);

      setAuthLoading(true);

      try {
        if (action === "register") {
          setMessage(
            "authMessage",
            "Creating account...",
            "info"
          );

          const {
            data,
            error
          } = await supabaseClient.auth.signUp({
            email,
            password,

            options: {
              data: {
                username
              }
            }
          });

          if (error) {
            throw error;
          }

          /*
           * If email confirmation is disabled,
           * Supabase normally returns a session immediately.
           */
          if (data.session) {
            setMessage(
              "authMessage",
              "Account created successfully.",
              "success"
            );

            usernameInput.value = "";
            passwordInput.value = "";
            return;
          }

          /*
           * When Confirm Email is enabled no usable session
           * will exist because the internal email cannot
           * receive confirmation emails.
           */
          setMessage(
            "authMessage",
            "Account was created, but Supabase email confirmation is enabled. Disable Confirm Email in Supabase Authentication settings for username-only accounts."
          );

        } else if (action === "login") {
          setMessage(
            "authMessage",
            "Signing in...",
            "info"
          );

          const {
            data,
            error
          } =
            await supabaseClient.auth.signInWithPassword({
              email,
              password
            });

          if (error) {
            setMessage(
              "authMessage",
              "Incorrect username or password."
            );

            return;
          }

          if (!data.session) {
            setMessage(
              "authMessage",
              "Unable to create a login session."
            );

            return;
          }

          usernameInput.value = "";
          passwordInput.value = "";
        }
      } catch (error) {
        console.error("Authentication error:", error);

        let message =
          error?.message ||
          "An authentication error occurred.";

        /*
         * Give nicer messages for common errors.
         */
        if (
          message
            .toLowerCase()
            .includes("already registered")
        ) {
          message =
            "That username is already registered.";
        }

        setMessage("authMessage", message);

      } finally {
        setAuthLoading(false);
      }
    }

    /*
     * ============================================================
     * LOGOUT
     * ============================================================
     */

    async function logout() {
      const { error } =
        await supabaseClient.auth.signOut();

      if (error) {
        alert("Could not log out: " + error.message);
      }
    }

    /*
     * ============================================================
     * POSTS
     * ============================================================
     */

    async function loadPosts() {
      const feed =
        document.getElementById("postsFeed");

      const status =
        document.getElementById("postsStatus");

      status.textContent = "Loading posts...";
      feed.innerHTML = "";

      const {
        data,
        error
      } = await supabaseClient
        .from("posts")
        .select(
          "id, title, category, content, username, created_at"
        )
        .order("created_at", {
          ascending: false
        })
        .limit(100);

      status.textContent = "";

      if (error) {
        console.error("Load posts error:", error);

        setMessage(
          "postsStatus",
          "Error loading posts: " + error.message
        );

        return;
      }

      if (!data || data.length === 0) {
        feed.innerHTML =
          "<p>No hosts files have been shared yet.</p>";

        return;
      }

      /*
       * Build DOM elements instead of injecting post content
       * with innerHTML. This avoids XSS problems.
       */
      data.forEach((post) => {
        feed.appendChild(createPostElement(post));
      });
    }

    function createPostElement(post) {
      const box = document.createElement("article");
      box.className = "box";

      const header =
        document.createElement("div");

      header.className = "post-header";

      const title =
        document.createElement("h3");

      title.style.margin = "0";
      title.textContent =
        post.title || "Untitled";

      const tag =
        document.createElement("span");

      tag.className = "tag";
      tag.textContent =
        post.category || "General";

      header.appendChild(title);
      header.appendChild(tag);

      const meta =
        document.createElement("div");

      meta.className = "meta";

      const username =
        post.username || "Anonymous";

      const date = formatDate(post.created_at);

      meta.textContent =
        `Posted by ${username} on ${date}`;

      const pre =
        document.createElement("pre");

      pre.textContent =
        post.content || "";

      const copyButton =
        document.createElement("button");

      copyButton.type = "button";
      copyButton.className = "btn-secondary";
      copyButton.style.marginTop = "10px";
      copyButton.textContent = "Copy Rules";

      copyButton.addEventListener(
        "click",
        () =>
          copyCode(
            post.content || "",
            copyButton
          )
      );

      box.appendChild(header);
      box.appendChild(meta);
      box.appendChild(pre);
      box.appendChild(copyButton);

      return box;
    }

    async function createPost() {
      const title =
        document
          .getElementById("postTitle")
          .value
          .trim();

      const category =
        document.getElementById("postCategory").value;

      const content =
        document
          .getElementById("postContent")
          .value
          .trim();

      const publishButton =
        document.getElementById("publishButton");

      setMessage("postMessage", "");

      if (!currentUser) {
        setMessage(
          "postMessage",
          "You must be logged in to publish."
        );
        return;
      }

      if (!title) {
        setMessage(
          "postMessage",
          "Enter a title."
        );
        return;
      }

      if (title.length > 100) {
        setMessage(
          "postMessage",
          "Title is too long."
        );
        return;
      }

      if (!content) {
        setMessage(
          "postMessage",
          "Enter at least one hosts rule."
        );
        return;
      }

      if (content.length > 50000) {
        setMessage(
          "postMessage",
          "Hosts content is too large."
        );
        return;
      }

      if (!ALLOWED_CATEGORIES.includes(category)) {
        setMessage(
          "postMessage",
          "Invalid category."
        );
        return;
      }

      publishButton.disabled = true;
      publishButton.textContent = "Publishing...";

      try {
        const {
          error
        } = await supabaseClient
          .from("posts")
          .insert({
            user_id: currentUser.id,
            username: currentUsername,
            title,
            category,
            content
          });

        if (error) {
          throw error;
        }

        document.getElementById(
          "postTitle"
        ).value = "";

        document.getElementById(
          "postContent"
        ).value = "";

        document.getElementById(
          "postCategory"
        ).value = "Adblocking";

        setMessage(
          "postMessage",
          "Post published successfully.",
          "success"
        );

        await loadPosts();

      } catch (error) {
        console.error("Create post error:", error);

        setMessage(
          "postMessage",
          "Failed to publish: " +
            (error?.message || "Unknown error")
        );

      } finally {
        publishButton.disabled = false;
        publishButton.textContent = "Publish Post";
      }
    }

    /*
     * ============================================================
     * CLIPBOARD
     * ============================================================
     */

    async function copyCode(text, button) {
      try {
        await navigator.clipboard.writeText(text);

        const oldText = button.textContent;
        button.textContent = "Copied ✓";

        setTimeout(() => {
          button.textContent = oldText;
        }, 1500);

      } catch (error) {
        console.error("Clipboard error:", error);

        /*
         * Clipboard API often requires HTTPS or localhost.
         */
        alert(
          "Could not copy automatically. Clipboard access normally requires HTTPS."
        );
      }
    }

    function formatDate(dateValue) {
      if (!dateValue) {
        return "Unknown date";
      }

      const date = new Date(dateValue);

      if (Number.isNaN(date.getTime())) {
        return "Unknown date";
      }

      return date.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    /*
     * Allow Enter in password box to log in.
     */
    document
      .getElementById("password")
      .addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          handleAuth("login");
        }
      });

    /*
     * Start application.
     */
    initializeApp();
  </script>
</body>
</html>
