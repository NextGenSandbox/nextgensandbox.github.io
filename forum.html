<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android Host File Forum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --bg: #0f1115; --card: #1a1d24; --text: #e2e8f0; --accent: #3ddc84; --error: #ef4444; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); max-width: 800px; margin: 0 auto; padding: 20px; }
    h1, h2, h3 { color: #fff; }
    .box { background: var(--card); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #2d3748; }
    .hidden { display: none !important; }
    input, select, textarea { width: 100%; padding: 12px; margin-bottom: 12px; background: #2d3748; border: 1px solid #4a5568; color: white; border-radius: 6px; box-sizing: border-box; }
    button { background: var(--accent); color: #000; padding: 12px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-right: 10px; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #4a5568; color: white; }
    .error-msg { color: var(--error); font-weight: bold; margin-bottom: 15px; }
    .success-msg { color: var(--accent); font-weight: bold; margin-bottom: 15px; }
    .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .tag { background: #2d3748; padding: 4px 10px; border-radius: 4px; font-size: 12px; color: var(--accent); }
    .meta { font-size: 12px; color: #a0aec0; margin-bottom: 10px; }
    pre { background: #000; padding: 15px; border-radius: 6px; overflow-x: auto; color: var(--accent); border: 1px solid #2d3748; }
  </style>
</head>
<body>

  <h1>🤖 Android Host File Forum</h1>

  <!-- AUTHENTICATION FORM -->
  <div id="authPage" class="box">
    <h2>Account Login / Register</h2>
    <div id="authMessage"></div>
    
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username..." />
    
    <label>Password</label>
    <input type="password" id="password" placeholder="At least 6 characters..." />
    
    <div style="margin-top: 10px;">
      <button onclick="handleAuth('login')">Sign In</button>
      <button class="btn-secondary" onclick="handleAuth('register')">Create Account</button>
    </div>
  </div>

  <!-- MAIN FORUM -->
  <div id="forumPage" class="hidden">
    <div class="box" style="display: flex; justify-content: space-between; align-items: center;">
      <div>Logged in as: <strong id="userDisplay" style="color: var(--accent);"></strong></div>
      <button class="btn-secondary" onclick="logout()" style="margin: 0;">Log Out</button>
    </div>

    <div class="box">
      <h3>Share a New Hosts File</h3>
      <div id="postError" class="error-msg"></div>
      
      <input type="text" id="postTitle" placeholder="Title (e.g., Block All Ads 2026)" />
      
      <select id="postCategory">
        <option value="Adblocking">Adblocking</option>
        <option value="Malware">Malware & Tracking</option>
        <option value="Gaming">Gaming & Apps</option>
        <option value="General">General</option>
      </select>

      <textarea id="postContent" rows="5" placeholder="0.0.0.0 ads.example.com&#10;0.0.0.0 trackers.com"></textarea>
      <button onclick="createPost()">Publish Post</button>
    </div>

    <h2>Recent Posts</h2>
    <div id="postsFeed"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hzazezszxbgethzkqmmf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6YXplenN6eGJlZ3RoemtxbW1mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNjA3NjQsImV4cCI6MjEwMzgzNjc2NH0.Vgi0AbiYnzPOD_uVafIMcUbNS-DbnD16BlVYTuHopQA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUsername = null;

    supabase.auth.onAuthStateChange((event, session) => {
      if (session && session.user) {
        currentUsername = session.user.user_metadata.username || session.user.email.split('@')[0];
        document.getElementById('authPage').classList.add('hidden');
        document.getElementById('forumPage').classList.remove('hidden');
        document.getElementById('userDisplay').innerText = currentUsername;
        loadPosts();
      } else {
        document.getElementById('authPage').classList.remove('hidden');
        document.getElementById('forumPage').classList.add('hidden');
      }
    });

    async function handleAuth(action) {
      const rawUser = document.getElementById('username').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const msgDiv = document.getElementById('authMessage');
      
      msgDiv.className = 'error-msg';

      if (!rawUser || !password) {
        msgDiv.innerText = 'Error: Enter both username and password.';
        return;
      }

      // Convert username to valid internal email format behind the scenes
      const dummyEmail = `${rawUser}@forum.local`;

      if (action === 'register') {
        msgDiv.className = 'success-msg';
        msgDiv.innerText = 'Creating account...';

        const { error } = await supabase.auth.signUp({
          email: dummyEmail,
          password: password,
          options: { data: { username: rawUser } }
        });

        if (error) {
          msgDiv.className = 'error-msg';
          msgDiv.innerText = 'Registration error: ' + error.message;
        } else {
          // Immediately log in after registration
          const { error: loginErr } = await supabase.auth.signInWithPassword({
            email: dummyEmail,
            password: password
          });
          if (loginErr) {
            msgDiv.className = 'error-msg';
            msgDiv.innerText = 'Created! Click Sign In to proceed.';
          }
        }
      } else if (action === 'login') {
        msgDiv.innerText = 'Signing in...';
        const { error } = await supabase.auth.signInWithPassword({
          email: dummyEmail,
          password: password
        });
        if (error) {
          msgDiv.innerText = 'Login failed: Check your username/password.';
        }
      }
    }

    async function logout() {
      await supabase.auth.signOut();
    }

    async function loadPosts() {
      const { data, error } = await supabase
        .from('posts')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('postsFeed').innerHTML = `<div class="error-msg">Error loading posts: ${error.message}</div>`;
        return;
      }
      
      const feed = document.getElementById('postsFeed');
      if (data.length === 0) {
        feed.innerHTML = '<p>No hosts files shared yet. Be the first!</p>';
        return;
      }

      feed.innerHTML = data.map(post => `
        <div class="box">
          <div class="post-header">
            <h3 style="margin:0;">${escapeHtml(post.title || 'Untitled')}</h3>
            <span class="tag">${escapeHtml(post.category || 'General')}</span>
          </div>
          <div class="meta">Posted by <strong>${escapeHtml(post.user_email || 'Anonymous')}</strong> on ${new Date(post.created_at).toLocaleDateString()}</div>
          <pre id="code-${post.id}">${escapeHtml(post.content || '')}</pre>
          <button class="btn-secondary" style="margin-top: 10px;" onclick="copyCode('code-${post.id}')">Copy Rules</button>
        </div>
      `).join('');
    }

    async function createPost() {
      const title = document.getElementById('postTitle').value;
      const category = document.getElementById('postCategory').value;
      const content = document.getElementById('postContent').value;
      const errorDiv = document.getElementById('postError');
      
      errorDiv.innerText = '';

      if (!title || !content) {
        errorDiv.innerText = 'Error: Title and Content are required.';
        return;
      }

      const { error } = await supabase
        .from('posts')
        .insert([{ 
          title: title, 
          category: category, 
          content: content, 
          user_email: currentUsername 
        }]);

      if (error) {
        errorDiv.innerText = 'Failed to post: ' + error.message;
      } else {
        document.getElementById('postTitle').value = '';
        document.getElementById('postContent').value = '';
        loadPosts();
      }
    }

    function copyCode(elementId) {
      const text = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(text);
      alert('Copied to clipboard!');
    }

    function escapeHtml(str) {
      return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }
  </script>
</body>
</html>
