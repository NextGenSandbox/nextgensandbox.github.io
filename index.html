<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android Host File – ROMs • TWRP • Odin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <div class="container">
      <h1>Android Host File</h1>
      <p>TWRP • Custom ROMs • Odin Firmware • Kernels</p>
      
      <div class="header-actions">
        <input type="text" id="search" placeholder="Search device or codename...">
        <button id="uploadBtn" class="upload-btn">Upload Host!</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="filters">
      <button class="filter active" data-filter="all">All</button>
      <button class="filter" data-filter="samsung">Samsung</button>
      <button class="filter" data-filter="twrp">TWRP</button>
      <button class="filter" data-filter="rom">ROMs</button>
      <button class="filter" data-filter="odin">Odin</button>
      <button class="filter" data-filter="other">Other</button>
    </div>

    <div id="devices" class="grid">
      <p style="grid-column:1/-1;text-align:center;color:#9ca3af">Loading...</p>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Powered by Supabase • Uploads are saved for everyone</p>
    </div>
  </footer>

  <!-- Upload Modal -->
  <div id="uploadModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Upload Host!</h2>
      <p class="modal-desc">Fill the form and it will be saved for everyone.</p>

      <div class="form-group">
        <label>Device Name *</label>
        <input type="text" id="req-device" placeholder="e.g. Samsung Galaxy S21">
      </div>

      <div class="form-group">
        <label>Codename *</label>
        <input type="text" id="req-codename" placeholder="e.g. o1s">
      </div>

      <div class="form-group">
        <label>Brand *</label>
        <select id="req-brand">
          <option value="samsung">Samsung</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>File Type *</label>
        <select id="req-type">
          <option value="twrp">TWRP / Recovery</option>
          <option value="rom">Custom ROM</option>
          <option value="odin">Odin Firmware</option>
          <option value="kernel">Kernel</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Download Link *</label>
        <input type="url" id="req-link" placeholder="https://...">
      </div>

      <div class="form-group">
        <label>Link Label</label>
        <input type="text" id="req-label" placeholder="e.g. TWRP 3.7.1" value="Download">
      </div>

      <div class="form-group">
        <label>Version</label>
        <input type="text" id="req-version" placeholder="optional">
      </div>

      <div class="form-group">
        <label>Checksum (MD5/SHA)</label>
        <input type="text" id="req-hash" placeholder="optional">
      </div>

      <div class="form-group">
        <label>Notes</label>
        <textarea id="req-notes" rows="2" placeholder="optional"></textarea>
      </div>

      <div class="modal-actions">
        <button id="submitBtn" class="copy-btn">Save to Site</button>
      </div>

      <p id="status" class="note"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
